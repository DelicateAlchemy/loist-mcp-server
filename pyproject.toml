[project]
name = "loist-mcp-server"
version = "0.1.0"
description = "FastMCP-based server for audio ingestion and embedding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.12.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "database"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".venv",
    "venv",
    "env",
    "build",
    "dist",
    "*.egg-info",
    ".tox",
    ".coverage",
    "htmlcov",
    "reports",
    "storage",
    ".mypy_cache",
]

[tool.ruff.lint]
select = ["E", "W", "F", "C"]
ignore = [
    "E203",  # whitespace before ':' (conflicts with black)
    "E501",  # line too long (handled by black)
    "F401",  # module imported but unused
    "F811",  # redefinition of unused variable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S101"]
"database/migrations/*" = ["E501", "F401"]
"scripts/*" = ["E501"]
"src/server.py" = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src", "database", "tests"]
skip = ["__init__.py"]

[tool.pylint.main]
# Basic configuration
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "W0613",  # unused-argument (can be too strict for some APIs)
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-complexity = 12

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B601"]  # Skip assert checks and shell usage

[tool.safety]
# Safety configuration for dependency vulnerability scanning
# Scans against Safety DB for known vulnerabilities in dependencies

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# pythonpath = ["."]  # Commented out - causes issues with site-packages imports
# PYTHONPATH=/app is set in docker-compose.yml, which is sufficient
addopts = "-v --tb=short --strict-markers --disable-warnings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "functional: End-to-end functional tests",
    "slow: Slow running tests",
    "metadata: Metadata generation tests",
    "social: Social media sharing tests",
    "asyncio: Async tests using pytest-asyncio",
    "requires_db: Tests requiring database connection",
    "requires_gcs: Tests requiring Google Cloud Storage",
    "requires_tools: Tests requiring static analysis tools (black, isort, etc.)",
    "regression: Regression tests for previously fixed bugs",
    "tasks_13_14: Tests related to tasks 13 and 14"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]


